<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
 <fieldset>
   
     <form action="#" >

    
        <label for="name">Username:</label>
        <input type="text" name="name" id="name" placeholder="Enter your name" required>

        <br><br>
        <label for="pass">Password:</label>
        <input type="password" name="pass" placeholder="Enter your password">
        
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email">
         
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="gender">
        <label for="gender">Male</label> 
         <input type="radio" name="gender" id="gender">
        <label for="gender">Female</label>  
         
        <br><br>
        <label for="hobb">Hobbies:</label>
        <input type="checkbox" name="hobb1" id="hobb1">
        <label for="hobb1">Cricket</label>
        <input type="checkbox" name="hobb2" id="hobb2">
        <label for="hobb2">Football</label>

        <br><br>
        <label for="dob">DOB:</label>
        <input type="date" name="dob" id="dob">
        
        <br><br>
        <label for="lang">Select Programming Language</label>
        <select name="lang" id="lang">
            <option value="">Select lang</option>
            <option value="c">C</option>
            <option value="c++">C++</option>
            <option value="python">Python</option>
            <option value="java">Java</option>




        </select>


    
    </form>
</fieldset>    
</body>
</html>
